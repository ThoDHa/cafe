name: Deploy menus to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ThoDHa/recipes
          path: recipes
          token: ${{ secrets.RECIPES_TOKEN }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Run generator tests
        env:
          RECIPES_CAFE: recipes/cafe.md
        run: uv run --with pytest --with weasyprint==70.0 pytest site/ -q
      - name: Install pinned Chrome headless shell
        run: npx -y playwright@1.63.0 install --with-deps chromium-headless-shell
      - name: Generate menus site
        run: uv run --with weasyprint==70.0 python site/generate.py --recipes recipes/cafe.md
      - name: Verify no-JS print budget in Chrome (gates deploy)
        run: uv run --with weasyprint==70.0 --with playwright==1.62.0 --with pypdf python site/verify_no_js_print.py --out site/public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
