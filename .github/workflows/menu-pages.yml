name: Deploy menus to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ThoDHa/recipes
          path: recipes
      - uses: astral-sh/setup-uv@v5
      - name: Run generator tests
        env:
          RECIPES_CAFE: recipes/cafe.md
        run: uv run --with pytest --with weasyprint pytest site/ -q
      - name: Generate menus site
        run: uv run --with weasyprint python site/generate.py --recipes recipes/cafe.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
