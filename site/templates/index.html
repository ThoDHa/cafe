<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Ông Thọ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root {
    --sua: #F3ECDC;
    --sua-deep: #EAE0C9;
    --cobalt: #1F3564;
    --cobalt-soft: #3A5183;
    --seal: #B5372A;
    --matcha: #6B7F3F;
    --ink: #1B2233;
    --ink-muted: #56513F;
    --rule: #C9BB9C;
    --display: 'Bungee', 'Arial Black', sans-serif;
    --names: 'Lora', Georgia, serif;
    --body: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { background: var(--sua-deep); }

  body {
    margin: 0;
    background: var(--sua-deep);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.6;
    padding: clamp(0.75rem, 3vw, 2.5rem);
  }

  .card {
    max-width: 880px;
    margin: 0 auto;
    background: var(--sua);
    border: 3px solid var(--cobalt);
    box-shadow: 0 0 0 6px var(--sua), 0 0 0 7px var(--rule), 0 18px 40px -18px rgba(31, 53, 100, 0.45);
    padding: clamp(1.5rem, 5vw, 3.5rem);
  }

  header {
    text-align: center;
    border: 2px solid var(--cobalt);
    box-shadow: inset 0 0 0 4px var(--sua), inset 0 0 0 5px var(--cobalt);
    padding: clamp(1.5rem, 4vw, 2.5rem) 1rem clamp(1.25rem, 3vw, 2rem);
    position: relative;
    background: var(--sua);
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--cobalt-soft);
    margin: 0 0 0.75rem;
  }

  h1 {
    font-family: var(--display);
    font-size: clamp(1.9rem, 6vw, 3.4rem);
    color: var(--cobalt);
    margin: 0;
    letter-spacing: 0.02em;
  }

  .tagline {
    font-family: var(--names);
    font-style: italic;
    color: var(--ink-muted);
    margin: 0.5rem 0 0;
  }

  .seal {
    position: absolute;
    top: -14px;
    right: 14px;
    background: var(--seal);
    color: var(--sua);
    font-family: var(--display);
    font-size: 0.8rem;
    padding: 0.35rem 0.6rem;
    border-radius: 4px;
    transform: rotate(6deg);
    box-shadow: 0 4px 10px -4px rgba(181, 55, 42, 0.6);
  }

  nav.menus {
    display: grid;
    gap: 1rem;
    margin: 2rem 0 0;
  }

  nav.menus a {
    display: block;
    border: 2px solid var(--cobalt);
    box-shadow: inset 0 0 0 3px var(--sua), inset 0 0 0 4px var(--rule);
    background: var(--sua);
    padding: 1.1rem 1.25rem;
    text-decoration: none;
    color: var(--ink);
  }

  nav.menus a:hover { background: #fff8e8; }

  nav.menus .vn {
    font-family: var(--names);
    font-weight: 600;
    font-size: 1.25rem;
    color: var(--cobalt);
  }

  nav.menus .en {
    font-size: 0.85rem;
    color: var(--ink-muted);
    margin-top: 0.15rem;
  }

  footer {
    text-align: center;
    margin-top: 2.5rem;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
</style>
</head>
<body>
<div class="card">
  <header>
    <p class="eyebrow">nhà làm · est. quán nhà</p>
    <h1>CAFE ÔNG THỌ</h1>
    <p class="tagline">cà phê &middot; mát-cha &middot; trà</p>
    <span class="seal" aria-hidden="true">THỌ</span>
  </header>
  <nav class="menus">
    <a href="menu.html">
      <div class="vn">Thực Đơn</div>
      <div class="en">Drinks menu</div>
    </a>
    <a href="kitchen.html">
      <div class="vn">Bếp</div>
      <div class="en">Kitchen menu</div>
    </a>
    <a href="bar.html">
      <div class="vn">Bar</div>
      <div class="en">Cocktail menu</div>
    </a>
  </nav>
  <footer>
    <p>CAFE ÔNG THỌ &middot; nhà làm &middot; made in house</p>
  </footer>
</div>
</body>
</html>
