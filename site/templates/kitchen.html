<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Ông Thọ — Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root {
    --sua: #F3ECDC;        /* label cream */
    --sua-deep: #EAE0C9;   /* darker cream for panels */
    --cobalt: #1F3564;     /* enamel sign blue */
    --cobalt-soft: #3A5183;
    --seal: #B5372A;       /* red seal / nóng */
    --matcha: #6B7F3F;     /* leaf green */
    --ink: #1B2233;
    --ink-muted: #56513F;  /* warm muted text on cream */
    --rule: #C9BB9C;       /* hairline on cream */
    --display: 'Bungee', 'Arial Black', sans-serif;
    --names: 'Lora', Georgia, serif;
    --body: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { background: var(--sua-deep); }

  body {
    margin: 0;
    background: var(--sua-deep);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.6;
    padding: clamp(0.75rem, 3vw, 2.5rem);
  }

  .card {
    max-width: 880px;
    margin: 0 auto;
    background: var(--sua);
    border: 3px solid var(--cobalt);
    box-shadow: 0 0 0 6px var(--sua), 0 0 0 7px var(--rule), 0 18px 40px -18px rgba(31, 53, 100, 0.45);
    padding: clamp(1.5rem, 5vw, 3.5rem);
  }

  /* ---------- header plaque ---------- */

  header {
    text-align: center;
    border: 2px solid var(--cobalt);
    box-shadow: inset 0 0 0 4px var(--sua), inset 0 0 0 5px var(--cobalt);
    padding: clamp(1.5rem, 4vw, 2.5rem) 1rem clamp(1.25rem, 3vw, 2rem);
    position: relative;
    background: var(--sua);
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--seal);
    font-weight: 600;
    margin: 0 0 0.75rem;
  }

  h1 {
    font-family: var(--display);
    font-weight: 400;
    color: var(--cobalt);
    font-size: clamp(1.9rem, 7vw, 3.4rem);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }

  .tagline {
    margin: 0.9rem 0 0;
    font-family: var(--names);
    font-style: italic;
    color: var(--ink-muted);
    font-size: clamp(0.95rem, 2.5vw, 1.1rem);
  }

  .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 3rem;
    height: 3rem;
    margin-top: 1.1rem;
    background: var(--seal);
    color: var(--sua);
    font-family: var(--display);
    font-size: 0.95rem;
    line-height: 1;
    border-radius: 4px;
    box-shadow: 0 2px 0 rgba(27, 34, 51, 0.25);
    transform: rotate(-3deg);
  }

  /* ---------- sections ---------- */

  section { margin-top: clamp(2.25rem, 6vw, 3.25rem); }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    border-bottom: 2px solid var(--cobalt);
    padding-bottom: 0.4rem;
    margin-bottom: 0.35rem;
  }

  h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.15rem, 3.5vw, 1.5rem);
    color: var(--cobalt);
    margin: 0;
    letter-spacing: 0.02em;
  }

  .section-en {
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    margin-left: auto;
    white-space: nowrap;
  }

  .section-note {
    margin: 0.5rem 0 1.25rem;
    font-size: 0.88rem;
    color: var(--ink-muted);
    font-style: italic;
    font-family: var(--names);
  }

  /* Column-major fill needs an explicit row count (the generator emits it
     inline per section), so items of equal rank share one grid row and the
     columns line up dish to dish instead of flowing to ragged heights. */
  .items {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-flow: column;
    column-gap: 2.5rem;
    row-gap: 1.4rem;
    margin-top: 1.4rem;
  }

  @media (max-width: 640px) {
    .items { grid-template-columns: 1fr; grid-auto-flow: row; }
  }

  /* ---------- menu items ---------- */

  .item { min-width: 0; break-inside: avoid; }

  .item-line {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }

  .item-name {
    font-family: var(--names);
    font-weight: 600;
    font-size: 1.08rem;
    color: var(--ink);
  }

  .tags { display: inline-flex; gap: 0.35rem; margin-left: auto; }

  .tag {
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .tag.nong { color: var(--seal); border: 1.5px solid var(--seal); background: var(--sua); }
  .tag.da   { color: var(--cobalt); border: 1.5px solid var(--cobalt); background: var(--sua); }

  .item-vi {
    font-family: var(--names);
    font-style: italic;
    color: var(--matcha);
    font-size: 0.9rem;
    margin: 0.1rem 0 0;
  }

  .item-desc {
    margin: 0.25rem 0 0;
    font-size: 0.88rem;
    color: var(--ink-muted);
    max-width: 34ch;
  }

  /* ---------- phin-drip divider ---------- */

  .drip {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    margin: clamp(2.25rem, 6vw, 3.25rem) 0 0;
  }

  .drip span {
    width: 7px;
    height: 7px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    background: var(--cobalt);
    opacity: 0.55;
  }

  .drip span:nth-child(2) { opacity: 0.8; }
  .drip span:nth-child(3) { opacity: 0.55; }

  /* ---------- footer ---------- */

  footer {
    margin-top: clamp(2.5rem, 6vw, 3.5rem);
    border-top: 2px solid var(--cobalt);
    padding-top: 1.25rem;
    text-align: center;
    font-size: 0.88rem;
    color: var(--ink-muted);
  }

  footer p { margin: 0.3rem 0; }

  footer a {
    color: var(--cobalt);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dotted var(--cobalt-soft);
  }

  footer a:hover { color: var(--seal); border-bottom-color: var(--seal); }
  footer a:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 3px; }

  .pdf-link {
    display: inline-block;
    margin-top: 0.9rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--cobalt);
    text-decoration: none;
    border-bottom: 1px dotted var(--cobalt-soft);
  }

  .pdf-link:hover { color: var(--seal); border-bottom-color: var(--seal); }
  .pdf-link:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- print ---------- */

/*SHARED_PRINT:page*/

  @media print {
/*SHARED_PRINT:base*/
    .card { max-width: none; border: none; box-shadow: none; padding: 0.5cm; }
/*SHARED_PRINT:keep*/
    .drip { display: none; }
/*SHARED_PRINT:color*/
    footer a { border-bottom: none; }
/*SHARED_PRINT:pdf-link*/
    .own-page { break-before: page; }
/*SHARED_PRINT:header*/
    section { margin-top: 0.8rem; }
    .items { column-gap: 1.2rem; row-gap: 1.4rem; margin-top: 0.4rem; }
    .item-name { font-size: 0.9rem; }
    .item-desc, .item-vi { font-size: 0.7rem; }
    .section-note { margin: 0.25rem 0 0.5rem; font-size: 0.72rem; }
    body { line-height: 1.3; }
/*SHARED_PRINT:footer*/
  }
</style>
</head>
<body>
<div class="card">

  <header>
    <p class="eyebrow">nhà làm · est. quán nhà</p>
    <h1>CAFE ÔNG THỌ</h1>
    <p class="tagline">khai vị &middot; món chính &middot; món phụ &middot; sốt &middot; tráng miệng</p>
    <span class="seal" aria-hidden="true">THỌ</span>
  </header>

<!--SECTIONS-->

  <footer>
    <p>nhà làm &middot; made in house</p>
    <p><a href="menu.html">The Drink Menu</a> &middot; <a href="bar.html">The Bar Menu</a></p>
    <a class="pdf-link" href="kitchen.pdf">Print PDF</a>
  </footer>

</div>
</body>
</html>
