<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Ông Thọ · In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root {
    --sua: #F3ECDC;        /* label cream */
    --sua-deep: #EAE0C9;   /* darker cream for panels */
    --cobalt: #1F3564;     /* enamel sign blue */
    --cobalt-soft: #3A5183;
    --seal: #B5372A;       /* red seal / nóng */
    --matcha: #6B7F3F;     /* leaf green */
    --ink: #1B2233;
    --ink-muted: #56513F;  /* warm muted text on cream */
    --rule: #C9BB9C;       /* hairline on cream */
    --display: 'Bungee', 'Arial Black', sans-serif;
    --names: 'Lora', Georgia, serif;
    --body: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { background: var(--sua-deep); }

  body {
    margin: 0;
    background: var(--sua-deep);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.55;
    padding: clamp(0.75rem, 3vw, 2.5rem);
  }

  .card {
    max-width: 880px;
    margin: 0 auto;
    background: var(--sua);
    border: 3px solid var(--cobalt);
    box-shadow: 0 0 0 6px var(--sua), 0 0 0 7px var(--rule), 0 18px 40px -18px rgba(31, 53, 100, 0.45);
    padding: clamp(1.5rem, 5vw, 3.5rem);
  }

  /* ---------- header plaque ---------- */

  header {
    text-align: center;
    border: 2px solid var(--cobalt);
    box-shadow: inset 0 0 0 4px var(--sua), inset 0 0 0 5px var(--cobalt);
    padding: clamp(1.2rem, 3vw, 2rem) 1rem clamp(1rem, 2.5vw, 1.6rem);
    position: relative;
    background: var(--sua);
  }

  .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--seal);
    font-weight: 600;
    margin: 0 0 0.6rem;
  }

  h1 {
    font-family: var(--display);
    font-weight: 400;
    color: var(--cobalt);
    font-size: clamp(1.7rem, 6vw, 2.8rem);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }

  .tagline {
    margin: 0.7rem 0 0;
    font-family: var(--names);
    font-style: italic;
    color: var(--ink-muted);
    font-size: clamp(0.9rem, 2.5vw, 1.05rem);
  }

  .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.6rem;
    height: 2.6rem;
    margin-top: 0.9rem;
    background: var(--seal);
    color: var(--sua);
    font-family: var(--display);
    font-size: 0.85rem;
    line-height: 1;
    border-radius: 4px;
    box-shadow: 0 2px 0 rgba(27, 34, 51, 0.25);
    transform: rotate(-3deg);
  }

  /* ---------- sections ---------- */

  section { margin-top: clamp(1.6rem, 4vw, 2.4rem); }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    border-bottom: 2px solid var(--cobalt);
    padding-bottom: 0.3rem;
    margin-bottom: 0.3rem;
  }

  h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.05rem, 3.5vw, 1.35rem);
    color: var(--cobalt);
    margin: 0;
    letter-spacing: 0.02em;
  }

  .section-en {
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    margin-left: auto;
    white-space: nowrap;
  }

  .section-note {
    margin: 0.4rem 0 0.9rem;
    font-size: 0.82rem;
    color: var(--ink-muted);
    font-style: italic;
    font-family: var(--names);
  }

  .items {
    columns: 3;
    column-gap: 2rem;
    margin-top: 1rem;
  }

  @media (max-width: 640px) {
    .items { columns: 1; }
  }

  /* ---------- menu items ---------- */

  .item { min-width: 0; break-inside: avoid; }

  .item-line {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
  }

  .item-name {
    font-family: var(--names);
    font-weight: 600;
    font-size: 1rem;
    color: var(--ink);
  }

  .tags { display: inline-flex; gap: 0.35rem; margin-left: auto; }

  .tag {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .tag.nong { color: var(--seal); border: 1.5px solid var(--seal); background: var(--sua); }
  .tag.da   { color: var(--cobalt); border: 1.5px solid var(--cobalt); background: var(--sua); }

  .item-vi {
    font-family: var(--names);
    font-style: italic;
    color: var(--matcha);
    font-size: 0.82rem;
    margin: 0.05rem 0 0;
  }

  /* ---------- footer ---------- */

  footer {
    margin-top: clamp(2rem, 5vw, 3rem);
    border-top: 2px solid var(--cobalt);
    padding-top: 1rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-muted);
  }

  footer p { margin: 0.3rem 0; }

  footer nav {
    display: flex;
    justify-content: center;
    gap: 1.1rem;
    margin-bottom: 0.8rem;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  footer a {
    color: var(--cobalt);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px dotted var(--cobalt-soft);
  }

  footer a:hover { color: var(--seal); border-bottom-color: var(--seal); }
  footer a:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- print ---------- */

  @page { margin: 0.6cm; margin-bottom: 1.2cm; }

  @media print {
    html, body { background: var(--sua); padding: 0; }
    .card { max-width: none; border: none; box-shadow: none; padding: 0.3cm; }
    section, .item { break-inside: avoid; }
    .section-head { break-after: avoid; }
    .seal, .tag {
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    footer nav { display: none; }
    footer { margin-top: 0.8rem; padding-top: 0.4rem; }
    header { padding: 0.5rem 1rem 0.45rem; }
    h1 { font-size: 1.6rem; }
    .seal { width: 1.8rem; height: 1.8rem; margin-top: 0.3rem; }
    .eyebrow { margin-bottom: 0.25rem; }
    .tagline { margin-top: 0.35rem; }
    section { margin-top: 0.25rem; }
    h2 { font-size: 0.95rem; }
    .section-head { padding-bottom: 0.15rem; margin-bottom: 0.12rem; }
    .items { columns: 3; column-gap: 1.1rem; margin-top: 0.2rem; }
    .item-name { font-size: 0.85rem; }
    .item-vi { font-size: 0.7rem; }
    .section-note { margin: 0.15rem 0 0.25rem; font-size: 0.68rem; }
    body { line-height: 1.2; }
  }
</style>
</head>
<body>
<div class="card">

  <header>
    <p class="eyebrow">bản rút gọn · in</p>
    <h1>CAFE ÔNG THỌ</h1>
    <p class="tagline">cà phê &middot; trà &middot; mát-cha &middot; giải khát &middot; kem</p>
    <span class="seal" aria-hidden="true">THỌ</span>
  </header>

  <!--SECTIONS-->

  <footer>
    <nav aria-label="menu navigation">
      <a href="../menu.html">Thực Đơn</a>
      <a href="#" aria-current="page">In</a>
      <a href="../kitchen.html">Bếp</a>
      <a href="../bar.html">Bar</a>
    </nav>
    <p>CAFE ÔNG THỌ &middot; nhà làm &middot; made in house</p>
  </footer>

</div>

</body>
</html>
